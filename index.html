<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha de treino</title>
<style>
:root{--bg:#eef1f5;--card:#ffffff;--ink:#101828;--mut:#5a6577;--line:#dde2ea;--track:#e6eaf0;--on:#ffffff;--ac:#3b5bdb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131b;--card:#171e29;--ink:#eef2f8;--mut:#9aa6b8;--line:#263041;--track:#222c3a}}
:root[data-theme="dark"]{--bg:#0e131b;--card:#171e29;--ink:#eef2f8;--mut:#9aa6b8;--line:#263041;--track:#222c3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
button{font:inherit;color:inherit;cursor:pointer}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 150px}
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:14px 0 8px;display:flex;align-items:center;gap:10px}
.bar-top h1{font-size:22px;margin:0;letter-spacing:-.02em;flex:1}
.back{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;font-size:18px;line-height:1}
.sub{color:var(--mut);font-size:14px;margin:0 0 6px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
/* semana */
.wk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:13px 14px;margin-top:10px}
.wk .d{width:38px;font-weight:750;font-size:16px}
.wk .m{flex:1;min-width:0}
.wk .m b{display:block;font-size:16px;line-height:1.2}
.wk .m span{color:var(--mut);font-size:13px}
.wk .p{width:74px;text-align:right;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.mini{height:6px;border-radius:9px;background:var(--track);margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--c);border-radius:9px}
.badge{display:inline-block;background:var(--c);color:#fff;border-radius:99px;font-size:11px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.wk.rest{opacity:.75}
/* dia */
.hero{background:var(--ac);color:var(--on);border-radius:18px;padding:18px 18px 16px;margin-top:4px}
.hero .day{font-size:14px;opacity:.85}
.hero h2{font-size:30px;line-height:1.1;margin:2px 0 4px;letter-spacing:-.02em}
.hero p{margin:0;opacity:.92;font-size:14px}
.prog{display:flex;align-items:center;gap:12px;margin-top:16px}
.bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .25s}
.cnt{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{background:rgba(255,255,255,.2);border-radius:99px;padding:3px 10px;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ac);border-radius:14px;padding:14px 14px 12px;margin-top:12px}
.card.fin{opacity:.6}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.name{font-weight:650;font-size:16.5px;line-height:1.25}
.meta{color:var(--mut);font-size:13px;margin-top:3px}
.sr{text-align:right;white-space:nowrap}
.sr b{font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sr span{display:block;font-size:12px;color:var(--mut)}
.sets{display:flex;align-items:center;gap:6px;margin-top:12px}
.set{flex:1;max-width:58px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--track);color:var(--mut);font-weight:700}
.set[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--on)}
.kg{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mut)}
.kg input{width:64px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:650;text-align:center}
.note{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;color:var(--mut);font-size:14px}
.restbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;margin-top:6px}
.restbox h2{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}
.restbox p{margin:0 0 8px;color:var(--mut)}
.reset{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:9px 12px;font-size:13px;margin-top:18px}
/* evolucao */
:root{--up:#0b8f4a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--up:#3ecf8e}}
:root[data-theme="dark"]{--up:#3ecf8e}
.hist{margin-top:2px}
.hist b{color:var(--ink);font-weight:650}
.up{color:var(--up);font-weight:650}
.dn{color:var(--mut);font-weight:650}
.spark{width:100%;height:56px;margin-top:10px;display:block}
.spark polyline{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--ac)}
.span{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:2px}
/* plano adaptativo */
.plan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
.plan summary{cursor:pointer;font-weight:650}
.plan label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
.plan select,.plan input{width:100%;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 10px;margin-top:4px}
.go{width:100%;height:46px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font-weight:700;margin-top:14px}
.wk.done{opacity:.7}
.dt{font-weight:500;color:var(--mut);font-size:11px}
.pwho{margin:10px 0 0;font-size:14px}
.pnote{margin:8px 0 0;font-size:13px;color:var(--mut);background:var(--bg);border-radius:10px;padding:8px 10px}
.pw{margin-top:12px}
.pe{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--mut);padding:3px 0;border-bottom:1px solid var(--line)}
.pe span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.card .plan{background:none;border:0;padding:0;margin-top:10px}
/* timer + nav */
.tm{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:12px;z-index:25;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.tm[hidden]{display:none}
.tm .t{font-weight:700;font-variant-numeric:tabular-nums;min-width:128px}
.tm .tb{flex:1;height:6px;border-radius:9px;background:rgba(128,128,128,.4);overflow:hidden}
.tm .tb i{display:block;height:100%;background:var(--bg);width:100%}
.tm button{border:0;background:rgba(128,128,128,.35);color:inherit;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
nav button{flex:1;max-width:240px;border:0;background:none;border-radius:12px;padding:7px 0 6px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600}
nav button[aria-current="page"]{color:var(--ink);background:var(--track)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

<div class="wrap" id="app"></div>
<div class="tm" id="tm" hidden><span class="t" id="tt"></span><div class="tb"><i id="tf"></i></div><button id="ts">Pular</button></div>

  <button id="n2"><svg viewBox="0 0 24 24"><path d="M6 8v8M3.5 10v4M18 8v8M20.5 10v4M6 12h12"/></svg>Hoje</button>

wk("Ombros + Braços B","Ombros, bíceps e tríceps",O,[cp("Desenvolvimento Arnold","Ombros",3,"10"),iso("Elevação lateral na polia","Ombro lateral",4,"12–15"),iso("Face pull ou crucifixo inverso","Ombro posterior",3,"15"),iso("Rosca alternada","Bíceps",3,"10"),iso("Tríceps na polia","Tríceps",3,"12"),iso("Rosca scott ou concentrada","Bíceps",2,"12"),iso("Tríceps testa","Tríceps",2,"10–12")]),
wk("Pernas B","Posterior de coxa e glúteo",L,[cp("Levantamento terra romeno","Posterior de coxa",4,"8–10"),cp("Hack ou agachamento frontal","Quadríceps",3,"10"),cp("Afundo búlgaro","Quadríceps",3,"10 por perna"),iso("Mesa ou cadeira flexora","Posterior de coxa",3,"10–12"),iso("Cadeira abdutora","Glúteo",3,"15"),iso("Panturrilha sentado","Panturrilha",4,"12–15")])]}
];
var WM=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"],WMF=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"],WD=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"],WDF=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
var KEY="ficha-app-v2",S={done:{},plans:{},prog:"model"},tab="week",open=null,openLab=null,T=null,iv=null;
try{var s0=JSON.parse(localStorage.getItem(KEY)||"{}");if(s0){S.done=s0.done||{};S.plans=s0.plans||{};S.prog=s0.prog||"model";if(!s0.plans&&s0.plan&&s0.plan.date)S.plans.model=s0.plan}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function progOf(id){return PR.filter(function(p){return p.id===id})[0]||PR[0]}
var P=progOf(S.prog);
function Wk(i){return i<0?REST:P.W[i]}
function PL(){var q=S.plans[P.id];return q&&q.date?q:{last:null,date:null}}
var TODAY=(new Date().getDay()+6)%7;
var TD=new Date().toLocaleDateString("sv-SE"),HK="ficha-hist-v1",H={},DB=null,DBERR=false;
try{H=JSON.parse(localStorage.getItem(HK)||"{}")||{}}catch(e){H={}}
function slug(n){return n.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function kgf(n){return String(n).replace(".",",")}
function ents(k){return H[k]&&H[k].entries?H[k].entries.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0}):[]}
function prevE(k){var e=ents(k).filter(function(x){return x.d<TD});return e.length?e[e.length-1]:null}
function todayVal(k){var e=ents(k).filter(function(x){return x.d===TD});return e.length?e[0].kg:null}
function dm(d){return d.slice(8,10)+"/"+d.slice(5,7)}
function histLine(k){
  var e=ents(k);if(!e.length)return '<div class="meta hist">Sem registro ainda</div>';
  var pr=prevE(k),t=todayVal(k),best=Math.max.apply(null,e.map(function(x){return x.kg}));
  var h=pr?'Última: <b>'+kgf(pr.kg)+' kg</b> ('+dm(pr.d)+')':'Primeiro registro';
  h+=' · Melhor: <b>'+kgf(best)+' kg</b>';
  if(t!==null&&pr){var df=Math.round((t-pr.kg)*100)/100;h+=' · <span class="'+(df>0?'up':'dn')+'">'+(df>0?'+':df<0?'':'±')+kgf(df===0?"0":df)+' kg</span>'}
  return '<div class="meta hist">'+h+'</div>';
}
function dBetween(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5)}
function shiftDay(n){return new Date(Date.now()+n*864e5).toLocaleDateString("sv-SE")}
function sched(){
  var pl=PL();if(pl.last==null)return null;
  var pat=P.pat,n=pat.length,p=pat.indexOf(pl.last);if(p<0)return null;
  var diff=Math.max(0,dBetween(pl.date,TD)),s0=diff===0?1:0,e=[];
  for(var j=1;j<=n+7;j++)e.push(pat[(p+j)%n]);
  var r=0;while(e[r]===-1)r++;
  var rem=diff===0?r:Math.max(0,r+1-diff),seq=[];
  for(var q=0;q<rem;q++)seq.push(-1);
  seq=seq.concat(e.slice(r));
  var out=[];
  for(var k=0;k<7;k++){var d=new Date();d.setDate(d.getDate()+k);
    var it=k<s0?{w:pl.last,done:true}:{w:seq[k-s0]};
    it.k=k;it.wd=d.getDay();it.dt=d.toLocaleDateString("sv-SE");out.push(it)}
  return out;
}
function labOf(it){var q=it.dt.slice(8,10)+"/"+it.dt.slice(5,7);return{h:WD[it.wd]+" "+q+(it.k===0?" · hoje":it.k===1?" · amanhã":""),d:WDF[it.wd]+", "+q}}
function labDef(i){return{h:WM[i]+(i===TODAY?" · hoje":""),d:WMF[i]}}
function savePlan(){
  save();
  if(DB)DB.doc("plano").set({plans:S.plans,prog:S.prog}).catch(function(){DBERR=true});
}
function todayInfo(){
  var sc=sched();if(!sc)return{w:P.pat[TODAY],lab:labDef(TODAY)};
  var it=sc[0];if(it.done)return{w:it.w,done:true,sc:sc};
  return{w:it.w,lab:labOf(it)};
}
function saveEx(k){
  try{localStorage.setItem(HK,JSON.stringify(H))}catch(e){}
  if(DB){DB.doc(k).set({name:H[k].name,entries:H[k].entries}).catch(function(){DBERR=true})}
}
function setLoad(k,name,val){
  var v=parseFloat(String(val).replace(",","."));
  var h=H[k]||(H[k]={name:name,entries:[]});
  h.entries=h.entries.filter(function(x){return x.d!==TD});
  if(isFinite(v)&&v>0)h.entries.push({d:TD,kg:v});
  h.entries.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  saveEx(k);
}
async function initDb(){
  try{
    if(!window.claude||!claude.use)return;
    var user=await claude.use("user"),uid=user?await user.id():null,d=await claude.use("db");
    if(!d||!uid)return;
    DB=d.collection("data/users/"+uid);
    var snap=await DB.get();
    snap.docs.forEach(function(x){var v=x.data();if(!v)return;
      if(v.entries)H[x.id]={name:v.name,entries:v.entries.slice()};
      else if(x.id==="plano"){if(v.plans)S.plans=v.plans;else if(v.last>=0&&v.date)S.plans.model={last:v.last,date:v.date};if(v.prog)S.prog=v.prog;P=progOf(S.prog);save()}});
    try{localStorage.setItem(HK,JSON.stringify(H))}catch(e){}
    render();
  }catch(e){DB=null}
}
function spark(es){
  es=es.slice(-12);var w=200,hh=44,mn=Math.min.apply(null,es.map(function(x){return x.kg})),mx=Math.max.apply(null,es.map(function(x){return x.kg}));
  var pts=es.map(function(x,i){var px=es.length>1?6+i*(w-12)/(es.length-1):w/2,py=mx===mn?hh/2:hh-5-(x.kg-mn)/(mx-mn)*(hh-10);return[px,py]});
  var l=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+hh+'" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1)}).join(" ")+'"/><circle cx="'+l[0].toFixed(1)+'" cy="'+l[1].toFixed(1)+'" r="3.5"/></svg>';
}
function evoView(){
  var h='<div class="bar-top"><h1>Evolução</h1></div><p class="sub">'+(DB&&!DBERR?'Cargas salvas na sua conta, sempre disponíveis para comparar.':'Cargas salvas só neste navegador.')+'</p>';
  var keys=Object.keys(H).filter(function(k){return ents(k).length});
  if(!keys.length)return h+'<div class="restbox"><h2>Sem registros ainda</h2><p>Anote a carga de cada exercício no treino do dia e a evolução aparece aqui.</p></div>';
  keys.sort(function(a,b){return H[a].name.localeCompare(H[b].name,"pt")});
  keys.forEach(function(k){
    var e=ents(k),f=e[0],l=e[e.length-1],best=Math.max.apply(null,e.map(function(x){return x.kg})),df=Math.round((l.kg-f.kg)*100)/100;
    h+='<section class="card"><div class="row"><div><div class="name">'+H[k].name+'</div><div class="meta">Atual <b>'+kgf(l.kg)+' kg</b> · Melhor '+kgf(best)+' kg · '+e.length+' registro'+(e.length>1?'s':'')+'</div></div><div class="sr"><b class="'+(df>0?'up':'dn')+'">'+(df>0?'+':df<0?'':'±')+kgf(df===0?"0":df)+' kg</b><span>desde o início</span></div></div>'+(e.length>1?spark(e)+'<div class="span"><span>'+dm(f.d)+'</span><span>'+dm(l.d)+'</span></div>':'')+'</section>';
  });
  return h;
}
function tot(d){return d.ex.reduce(function(a,e){return a+e[2]},0)}
function dk(w,x,s){return P.id+"~"+w+"-"+x+"-"+s}
function made(w){var n=0;Wk(w).ex.forEach(function(e,x){for(var s=0;s<e[2];s++)if(S.done[dk(w,x,s)])n++});return n}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function planBox(){
  var o='<option value="-1">Nenhum, começar do início</option>';
  P.W.forEach(function(w,q){o+='<option value="'+q+'">'+w.t+'</option>'});
  return '<details class="plan"><summary>Perdeu algum treino? Reorganizar a semana</summary><label for="pl-w">Qual foi o último treino que você fez?</label><select id="pl-w">'+o+'</select><label for="pl-d">Em que dia?</label><input type="date" id="pl-d" value="'+TD+'" max="'+TD+'"><button class="go" id="pl-go">Reorganizar a partir daqui</button>'+(PL().last!=null?'<button class="reset" id="pl-clr">Voltar à semana fixa</button>':'')+'</details>';
}
function row(it,lab,lead){
  var w=it.w,d=Wk(w),t=tot(d),m=made(w),bd=it.k===0||it.today?'<span class="badge">Hoje</span>':'';
  if(it.done)return '<div class="wk done" style="--c:'+d.c+'">'+lead+'<span class="m"><b>'+d.t+bd+'</b><span>Concluído</span></span><span class="p">✓</span></div>';
  if(w<0)return '<div class="wk rest" style="--c:'+G+'">'+lead+'<span class="m"><b>Descanso'+bd+'</b><span>Recuperação</span></span><span class="p"></span></div>';
  return '<button class="wk" style="--c:'+d.c+'" data-open="'+w+'" data-h1="'+lab.h+'" data-dy="'+lab.d+'">'+lead+'<span class="m"><b>'+d.t+bd+'</b><span>'+d.f+'</span></span><span class="p">'+m+' / '+t+'<div class="mini"><i style="width:'+Math.round(m/t*100)+'%"></i></div></span></button>';
}
function weekView(){
  var sc=sched(),h;
  if(!sc){
    h='<div class="bar-top"><h1>Semana</h1></div><p class="sub"><b>'+P.name+'</b> · '+P.days+' treinos por semana.</p>'+planBox();
    P.pat.forEach(function(w,i){h+=row({w:w,today:i===TODAY},labDef(i),'<span class="d">'+WM[i]+'</span>')});
  }else{
    var pl=PL();
    h='<div class="bar-top"><h1>Próximos 7 dias</h1></div><p class="sub"><b>'+P.name+'</b> · ajustado a partir do último treino: '+P.W[pl.last].t+' em '+dm(pl.date)+'.</p>'+planBox();
    sc.forEach(function(it){h+=row(it,labOf(it),'<span class="d">'+WD[it.wd]+'<br><small class="dt">'+dm(it.dt)+'</small></span>')});
  }
  return h+'<button class="reset" id="reset">Limpar marcações das séries</button>';
}
function dayView(w,back,lab){
  var d=Wk(w),t=tot(d),m=made(w);
  var h='<div class="bar-top">'+(back?'<button class="back" id="back" aria-label="Voltar">‹</button>':'')+'<h1>'+(lab?lab.h:d.t)+'</h1></div>';
  if(!t)return h+'<div class="restbox"><h2>Dia de descanso</h2><p>Recuperar também é treino. É durante o descanso que o músculo cresce.</p><p>Durma 7–9 h, beba bastante água e, se quiser, faça uma caminhada leve de 20–30 min.</p></div>';
  var mus={};d.ex.forEach(function(e){mus[e[1]]=(mus[e[1]]||0)+e[2]});
  h+='<div class="hero"><div class="day">'+(lab?lab.d:P.name)+' · '+P.name+'</div><h2>'+d.t+'</h2><p>'+d.f+'</p><div class="prog"><div class="bar"><i style="width:'+Math.round(m/t*100)+'%"></i></div><div class="cnt">'+m+' de '+t+' séries</div></div><div class="chips">'+Object.keys(mus).map(function(k){return '<span class="chip">'+k+' · '+mus[k]+'</span>'}).join("")+'</div></div>';
  if(d.note)h+='<div class="note">'+d.note+'</div>';
  d.ex.forEach(function(e,x){
    var b="",n=0;for(var s=0;s<e[2];s++){var k=dk(w,x,s),on=!!S.done[k];if(on)n++;
      b+='<button class="set" aria-pressed="'+on+'" aria-label="Série '+(s+1)+' de '+e[2]+'" data-k="'+k+'" data-r="'+e[4]+'">'+(on?"✓":(s+1))+'</button>'}
    var sg=slug(e[0]),pe=prevE(sg);
    h+='<section class="card'+(n===e[2]?' fin':'')+'"><div class="row"><div><div class="name">'+e[0]+'</div><div class="meta">'+e[1]+' · descanso '+R[e[4]][1]+'</div>'+histLine(sg)+'</div><div class="sr"><b>'+e[2]+' × '+e[3]+'</b><span>séries × reps</span></div></div><div class="sets">'+b+'<label class="kg"><input type="number" inputmode="decimal" min="0" step="0.5" placeholder="'+(pe?kgf(pe.kg):"kg")+'" aria-label="Carga em kg" data-kg="'+sg+'" data-nm="'+e[0]+'" value="'+(todayVal(sg)||"")+'"></label></div></section>';
  });
  return h+'<button class="go" data-fin="'+w+'">Concluí este treino</button>';
}
function doneToday(ti){
  var nx=ti.sc.filter(function(x){return x.k>0&&x.w>=0})[0],l=nx?labOf(nx):null;
  return '<div class="bar-top"><h1>Hoje</h1></div><div class="restbox"><h2>Treino de hoje concluído ✓</h2><p>'+Wk(ti.w).t+' feito. Descanse e recupere.</p>'+(nx?'<p>Próximo treino: <b>'+Wk(nx.w).t+'</b> ('+l.d+').</p>':'')+'</div>';
}
function progView(){
  var h='<div class="bar-top"><h1>Fichas</h1></div><p class="sub">Todas seguem o que a pesquisa sustenta: cerca de 10 a 20 séries por músculo por semana, progressão de carga e séries perto da falha. Nenhuma divisão vence as outras por si só; a melhor é a que você consegue repetir toda semana.</p>';
  PR.forEach(function(p){
    var on=p.id===P.id,list=p.W.map(function(w){return '<div class="pw"><b>'+w.t+'</b>'+w.ex.map(function(e){return '<div class="pe"><span>'+e[0]+'</span><span>'+e[2]+' × '+e[3]+'</span></div>'}).join("")+'</div>'}).join("");
    h+='<section class="card" style="--ac:'+p.W[0].c+'"><div class="row"><div><div class="name">'+p.name+(on?'<span class="badge" style="--c:'+p.W[0].c+'">Ativa</span>':'')+'</div><div class="meta">'+p.days+' dias por semana · '+p.freq+'</div></div></div><p class="pwho">'+p.who+'</p>'+(p.note?'<p class="pnote">'+p.note+'</p>':'')+'<details class="plan"><summary>Ver treinos e exercícios</summary>'+list+'</details>'+(on?'':'<button class="go" data-prog="'+p.id+'">Usar esta ficha</button>')+'</section>';
  });
  return h;
}
function render(){
  var ti=todayInfo(),i=open!==null?open:ti.w,y=window.scrollY;
  document.documentElement.style.setProperty("--ac",(tab==="evo"||tab==="prog"||(tab==="week"&&open===null))?U:Wk(i).c);
  document.getElementById("app").innerHTML=tab==="evo"?evoView():tab==="prog"?progView():(tab==="week"&&open===null)?weekView():open!==null?dayView(open,true,openLab):ti.done?doneToday(ti):dayView(ti.w,false,ti.lab);
  ["week","today","evo","prog"].forEach(function(t,n){document.getElementById("n"+(n+1)).setAttribute("aria-current",tab===t?"page":"false")});
  window.scrollTo(0,y);
}
function startT(sec){T={end:Date.now()+sec*1000,tot:sec};document.getElementById("tm").hidden=false;tick();clearInterval(iv);iv=setInterval(tick,250)}
function tick(){if(!T)return;var l=Math.ceil((T.end-Date.now())/1000);if(l<=0){stopT();try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}return}
  document.getElementById("tt").textContent="Descanso "+fmt(l);document.getElementById("tf").style.width=(l/T.tot*100)+"%"}
function stopT(){clearInterval(iv);T=null;document.getElementById("tm").hidden=true}
function go(t){tab=t;open=null;openLab=null;render();window.scrollTo(0,0)}
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-open]");
  if(t){open=+t.dataset.open;openLab=t.dataset.h1?{h:t.dataset.h1,d:t.dataset.dy}:null;tab="week";render();window.scrollTo(0,0);return}
  var fin=ev.target.closest("[data-fin]");
  if(fin){var w=+fin.dataset.fin;S.plans[P.id]={last:w,date:TD};Object.keys(S.done).forEach(function(k){if(k.indexOf(P.id+"~"+w+"-")===0)delete S.done[k]});savePlan();stopT();go("week");return}
  var pg=ev.target.closest("[data-prog]");
  if(pg){S.prog=pg.dataset.prog;P=progOf(S.prog);savePlan();stopT();go("week");return}
  if(ev.target.closest("#pl-go")){var sw=+document.getElementById("pl-w").value,sd=document.getElementById("pl-d").value||TD;
    if(sd>TD)sd=TD;
    var lastW=P.pat.filter(function(x){return x>=0}).pop();
    S.plans[P.id]=sw<0?{last:lastW,date:shiftDay(-8)}:{last:sw,date:sd};savePlan();go("week");return}
  if(ev.target.closest("#pl-clr")){S.plans[P.id]={last:null,date:null};savePlan();go("week");return}
  if(ev.target.closest("#back")){open=null;openLab=null;render();return}
  if(ev.target.closest("#n1")){go("week");return}
  if(ev.target.closest("#n2")){go("today");return}
  if(ev.target.closest("#n3")){go("evo");return}
  if(ev.target.closest("#n4")){go("prog");return}
  if(ev.target.closest("#ts")){stopT();return}
  if(ev.target.closest("#reset")){S.done={};save();stopT();render();return}
  var s=ev.target.closest(".set");
  if(s){var k=s.dataset.k;if(S.done[k])delete S.done[k];else{S.done[k]=1;startT(R[s.dataset.r][0])}
    save();render();var el=document.querySelector('[data-k="'+k+'"]');if(el)el.focus({preventScroll:true})}
});
document.addEventListener("change",function(ev){var e=ev.target;if(e.dataset&&e.dataset.kg!==undefined){setLoad(e.dataset.kg,e.dataset.nm,e.value);render()}});
render();
initDb();
</script>
